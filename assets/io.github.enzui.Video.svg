<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Video</title>
  <defs>
    <filter id="enz-video-drop" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dy="2" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.28"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- landscape keyline; film frame 92 x 72 (18..110 x 28..100); screen 80 x 48 between the perforation strips;
       play triangle: outline centre 65.5, centroid 62.3, their midpoint sits on the screen centre 64 -->
  <g filter="url(#enz-video-drop)">
    <rect x="18" y="28" width="92" height="72" rx="9" fill="#4A505C"/>
  </g>
  <rect x="24" y="40" width="80" height="48" rx="4" fill="#FFFFFF"/>
  <g fill="#C9D1DC"><rect x="26" y="32" width="8" height="6" rx="2"/><rect x="42" y="32" width="8" height="6" rx="2"/><rect x="60" y="32" width="8" height="6" rx="2"/><rect x="78" y="32" width="8" height="6" rx="2"/><rect x="94" y="32" width="8" height="6" rx="2"/><rect x="26" y="90" width="8" height="6" rx="2"/><rect x="42" y="90" width="8" height="6" rx="2"/><rect x="60" y="90" width="8" height="6" rx="2"/><rect x="78" y="90" width="8" height="6" rx="2"/><rect x="94" y="90" width="8" height="6" rx="2"/></g>
  <path d="M56 53 V75 L75 64 Z" fill="#4A505C" stroke="#4A505C" stroke-width="5" stroke-linejoin="round"/>
</svg>
